<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shreyaan | Landing Page</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

  <style>
    :root {
      /* Applying M3 Typography Tokens from your docs */
      --md-ref-typeface-brand: 'Google Sans';
      --md-ref-typeface-plain: 'Roboto';
      
      /* Colors */
      --md-sys-color-primary: #6750A4;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-secondary-container: #77F2A1; /* Availability Green */
      --md-sys-color-surface: #F6F2F7;
      --md-sys-color-surface-container: #ECE6F0;
      --md-sys-color-on-surface: #1C1B1F;
      --md-sys-color-outline: #79747E;

      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 440px;
      width: 100%;
    }

    /* Base Widget */
    .widget {
      background: var(--md-sys-color-surface-container);
      border-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 1. Profile Widget */
    .profile-card {
      grid-column: span 2;
      background: var(--md-sys-color-primary-container);
      align-items: center;
      text-align: center;
      padding: 32px 20px;
    }

    .avatar-blob {
      width: 80px;
      height: 80px;
      background: var(--md-sys-color-primary);
      /* Expressive shape from your reference image */
      border-radius: 30% 70% 50% 50% / 30% 30% 70% 70%;
      margin-bottom: 16px;
    }

    /* 2. TIME WIDGET (Pixel Clock Style) */
    .time-widget {
      background: #C2E7FF; /* Light Blue from M3 Palette */
      color: #001D35;
      min-height: 140px;
      justify-content: center;
    }

    .clock-text {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 300;
      font-size: 4.5rem;
      line-height: 0.8;
      letter-spacing: -2px;
      display: flex;
      align-items: flex-end;
    }

    .clock-ampm {
      font-size: 1.2rem;
      font-weight: 400;
      margin-left: 4px;
      margin-bottom: 8px;
    }

    /* 3. AVAILABILITY */
    .availability {
      background: var(--md-sys-color-secondary-container);
      color: #00391C;
    }

    /* 4. QUICK CONTACT */
    .contact-widget {
      grid-column: span 2;
      padding-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    md-outlined-text-field {
      flex: 1;
      --md-outlined-text-field-container-shape: 16px;
    }

    /* Typography Overrides */
    .label-small {
      font-family: var(--md-ref-typeface-brand);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .title-large {
      font-family: var(--md-ref-typeface-brand);
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }

    .full-width { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="bento-grid">
    <div class="widget profile-card">
      <div class="avatar-blob"></div>
      <h1 class="md-typescale-headline-medium" style="margin: 0; font-weight: 700;">Shreyaan Vashishtha</h1>
      <p class="md-typescale-body-medium">HKUST • Science & Technology</p>
    </div>

    <div class="widget time-widget">
      <div class="label-small">Local Time</div>
      <div class="clock-text" id="time-display">
        07:30<span class="clock-ampm">AM</span>
      </div>
    </div>

    <div class="widget availability">
      <div class="label-small">Availability</div>
      <div class="title-large">Open for Projects</div>
      <span class="material-symbols-outlined" style="position: absolute; bottom: 16px; right: 16px; font-size: 32px;">check_circle</span>
    </div>

    <div class="widget contact-widget">
      <div class="label-small">Quick Contact</div>
      <div class="title-large">Send a ping</div>
      <div class="input-row">
        <md-outlined-text-field label="Message" placeholder="Say hello..."></md-outlined-text-field>
        <md-filled-icon-button>
          <md-icon>send</md-icon>
        </md-filled-icon-button>
      </div>
    </div>

    <div class="widget full-width">
      <div class="label-small">Elsewhere</div>
      <md-list style="background: transparent; padding: 0;">
        <md-list-item href="#" type="link">
          <md-icon slot="start">link</md-icon>
          <div slot="headline">Portfolio</div>
        </md-list-item>
        <md-divider></md-divider>
        <md-list-item href="#" type="link">
          <md-icon slot="start">account_circle</md-icon>
          <div slot="headline">LinkedIn</div>
        </md-list-item>
      </md-list>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('time-display').innerHTML = 
        `${String(hours).padStart(2, '0')}:${mins}<span class="clock-ampm">${ampm}</span>`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
