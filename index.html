<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shreyaan | M3 Intelligence</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wdth,wght,GRAD,opsz@25..151,100..1000,-200..150,8..144&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>

  <style>
    :root {
      --m3-surface: #F6F2F7;
      --m3-container: #F3EDF7;
      --m3-primary-cnt: #EADDFF;
      --m3-tertiary-cnt: #C2E7FF;
      --m3-secondary-cnt: #E8DEF8;
      --m3-text: #1C1B1F;
      --m3-text-v: #49454F;
      --m3-accent: #FF3B30;
      --map-glow: rgba(103, 80, 164, 0.1);
      transition: all 0.8s ease;
    }

    .dark-mode {
      --m3-surface: #121212;
      --m3-container: #1E1B20;
      --m3-primary-cnt: #2B2930;
      --m3-tertiary-cnt: #003354;
      --m3-secondary-cnt: #332D41;
      --m3-text: #E6E1E5;
      --m3-text-v: #CAC4D0;
      --map-glow: rgba(208, 188, 255, 0.15);
    }

    body { 
      margin: 0; display: flex; justify-content: center; padding: 40px 16px; 
      font-family: 'Roboto Flex', sans-serif; background: var(--m3-surface);
      color: var(--m3-text); overflow-x: hidden;
    }

    .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 420px; width: 100%; }
    
    .widget { background: var(--m3-container); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    .label-m3 {
      font-family: 'Google Sans'; font-weight: 700; font-size: 0.65rem;
      text-transform: uppercase; letter-spacing: 0.12em; color: var(--m3-text-v); margin-bottom: 8px; z-index: 2;
    }

    .profile-card { background: var(--m3-primary-cnt); grid-column: span 2; align-items: center; text-align: center; }
    .avatar-blob { 
      width: 80px; height: 80px; background: #6051a3; margin-bottom: 20px; 
      animation: m3-morph 10s infinite; transition: background 2s ease;
    }

    .media-widget { background: #000; color: white; grid-column: span 2; min-height: 180px; justify-content: space-between; }
    #squiggleCanvas { width: 100%; height: 40px; margin: 12px 0; }

    .time-widget { background: var(--m3-tertiary-cnt); }
    .clock-h { font-variation-settings: 'wdth' 45, 'wght' 300; font-size: 5.5rem; line-height: 0.8; letter-spacing: -4px; }
    .clock-m { font-variation-settings: 'wdth' 35, 'wght' 300; font-size: 5.5rem; line-height: 0.8; letter-spacing: -4px; opacity: 0.35; }

    .weather-widget { background: var(--m3-secondary-cnt); justify-content: space-between; cursor: pointer; }
    .weather-widget::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at var(--map-x, 50%) var(--map-y, 50%), var(--map-glow) 0%, transparent 70%);
      z-index: 1; pointer-events: none;
    }

    .temp-display { font-variation-settings: 'wdth' 70, 'wght' 450; font-size: 3.5rem; line-height: 1; letter-spacing: -1.5px; z-index: 2; }
    
    .spinning { animation: rotate 1s linear infinite; }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes m3-morph {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      50% { border-radius: 30% 60% 70% 40% / 60% 30% 60% 30%; }
    }
  </style>
</head>
<body>

  <div class="bento-grid">
    <div class="widget profile-card">
      <div class="avatar-blob" id="avatar"></div>
      <h1 class="md-typescale-headline-small" style="font-weight: 700; margin: 0; font-family: 'Google Sans';">Shreyaan Vashishtha</h1>
      <p class="md-typescale-body-medium" style="opacity: 0.6; margin-top: 4px;">HKUST • Aerospace Engineering</p>
    </div>

    <div class="widget media-widget">
      <div style="display: flex; align-items: center; gap: 14px;">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/c1/The_Weeknd_-_After_Hours.png" style="width: 48px; height: 48px; border-radius: 10px;">
        <div>
          <div class="md-typescale-title-medium" style="font-weight: 700;">After Hours</div>
          <div class="md-typescale-label-large" style="color: var(--m3-accent); font-weight: 600;">The Weeknd</div>
        </div>
      </div>
      <canvas id="squiggleCanvas"></canvas>
      <div style="display: flex; justify-content: space-around; align-items: center;">
        <md-icon-button style="--md-icon-button-icon-color: white;"><md-icon>skip_previous</md-icon></md-icon-button>
        <md-filled-icon-button id="playToggle" style="--md-filled-icon-button-container-color: white; --md-filled-icon-button-icon-color: black; --md-filled-icon-button-container-shape: 12px;">
          <md-icon id="playIcon">pause</md-icon>
        </md-filled-icon-button>
        <md-icon-button style="--md-icon-button-icon-color: white;"><md-icon>skip_next</md-icon></md-icon-button>
      </div>
    </div>

    <div class="widget time-widget">
      <div class="label-m3">Local Time</div>
      <div style="display: flex; flex-direction: column; margin-top: auto;">
        <div class="clock-h" id="h">--</div>
        <div class="clock-m" id="m">--</div>
        <div id="ap" style="align-self: flex-end; font-weight: 700; font-size: 1.2rem; opacity: 0.8;">--</div>
      </div>
    </div>

    <div class="widget weather-widget" id="weatherWidget" onclick="syncWeather()">
      <div class="label-m3" id="loc-label">Hong Kong</div>
      <span class="material-symbols-outlined" id="w-icon" style="font-size: 40px; transition: 0.3s; z-index: 2;">sync</span>
      <div style="z-index: 2;">
        <div class="temp-display" id="temp">--°</div>
        <div class="md-typescale-label-medium" id="w-desc" style="font-weight: 600; opacity: 0.7;">Syncing...</div>
        <div class="md-typescale-label-small" id="w-hum" style="opacity: 0.5;">Humidity: --%</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('squiggleCanvas');
    const ctx = canvas.getContext('2d');
    let phase = 0, isPlaying = true, currentAmp = 6, targetAmp = 6;

    async function syncWeather() {
      const icon = document.getElementById('w-icon');
      icon.classList.add('spinning');
      
      let lat = 22.3367, lon = 114.2639, city = "Hong Kong"; // Default HKUST

      try {
        const loc = await fetch('https://ipapi.co/json/').then(r => r.json());
        if(loc.latitude) { lat = loc.latitude; lon = loc.longitude; city = loc.city; }
      } catch (e) { console.log("Using default location"); }

      try {
        const weather = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto`).then(r => r.json());
        const cur = weather.current;
        
        document.getElementById('loc-label').innerText = city;
        document.getElementById('temp').innerText = `${Math.round(cur.temperature_2m)}°`;
        document.getElementById('w-hum').innerText = `Humidity: ${cur.relative_humidity_2m}%`;

        const weatherMap = { 
          0: ['sunny', 'Clear', '#FFB700'], 1: ['partly_cloudy_day', 'Mainly Clear', '#9575CD'], 
          2: ['partly_cloudy_day', 'Partly Cloudy', '#7E57C2'], 3: ['cloud', 'Cloudy', '#90A4AE'], 
          61: ['rainy', 'Rainy', '#455A64'], 95: ['thunderstorm', 'Stormy', '#311B92'] 
        };

        const [wIcon, desc, color] = weatherMap[cur.weather_code] || ['cloud', 'Cloudy', '#6051a3'];
        icon.innerText = wIcon;
        document.getElementById('w-desc').innerText = desc;
        document.getElementById('avatar').style.background = color;

        // Update Glow Position
        const x = ((lon + 180) / 360) * 100;
        const y = (1 - (lat + 90) / 180) * 100;
        document.getElementById('weatherWidget').style.setProperty('--map-x', `${x}%`);
        document.getElementById('weatherWidget').style.setProperty('--map-y', `${y}%`);

      } catch (e) { document.getElementById('w-desc').innerText = "Offline"; }
      
      setTimeout(() => icon.classList.remove('spinning'), 1000);
    }

    function render() {
      const w = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
      const h = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      ctx.clearRect(0, 0, w, h);
      currentAmp += (targetAmp - currentAmp) * 0.1;
      ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(canvas.offsetWidth, 20);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      const prog = canvas.offsetWidth * 0.72;
      for (let x = 0; x <= prog; x++) {
        const y = 20 + Math.sin(x * 0.12 + phase) * currentAmp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      if (isPlaying) phase -= 0.18;
      requestAnimationFrame(render);
    }

    function tick() {
      const d = new Date();
      const hrs = d.getHours();
      document.getElementById('h').innerText = String(hrs % 12 || 12).padStart(2, '0');
      document.getElementById('m').innerText = String(d.getMinutes()).padStart(2, '0');
      document.getElementById('ap').innerText = hrs >= 12 ? 'PM' : 'AM';
      hrs >= 18 || hrs < 6 ? document.body.classList.add('dark-mode') : document.body.classList.remove('dark-mode');
    }

    document.getElementById('playToggle').onclick = (e) => {
      e.stopPropagation();
      isPlaying = !isPlaying;
      targetAmp = isPlaying ? 6 : 0;
      document.getElementById('playIcon').innerText = isPlaying ? 'pause' : 'play_arrow';
    };

    setInterval(tick, 1000); tick(); syncWeather(); render();
  </script>
</body>
</html>
