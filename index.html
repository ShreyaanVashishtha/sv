<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3 Expressive Dashboard | Shreyaan</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wdth,wght,GRAD,opsz@25..151,100..1000,-200..150,8..144&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>

  <style>
    :root {
      --m3-surface: #F6F2F7;
      --m3-container-low: #F3EDF7;
      --m3-container-high: #ECE6F0;
      --m3-primary-container: #EADDFF;
      --m3-tertiary-container: #C2E7FF;
      --m3-secondary-container: #E8DEF8;
      --m3-accent: #FF3B30;
      --m3-on-surface: #1C1B1F;
      --m3-blob-color: #6051a3;
    }

    body { margin: 0; display: flex; justify-content: center; padding: 40px 16px; font-family: 'Roboto Flex', sans-serif; background: var(--m3-surface); color: var(--m3-on-surface); }

    .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 440px; width: 100%; }
    
    .widget { background: var(--m3-container-low); border-radius: 32px; padding: 24px; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    /* PROFILE CARD & MORPHING BLOB */
    .profile-card { background: var(--m3-primary-container); grid-column: span 2; align-items: center; text-align: center; padding: 32px 24px; }
    
    .avatar-blob {
      width: 84px; height: 84px;
      background: var(--m3-blob-color);
      margin-bottom: 16px;
      /* M3 Fluid Morph + Tonal Pulse */
      animation: 
        m3-fluid-morph 10s cubic-bezier(0.2, 0, 0, 1) infinite,
        m3-tonal-pulse 4s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(96, 81, 163, 0.2);
    }

    @keyframes m3-fluid-morph {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      33%      { border-radius: 40% 60% 70% 30% / 50% 60% 30% 60%; }
      66%      { border-radius: 30% 60% 70% 40% / 60% 30% 60% 30%; }
    }

    @keyframes m3-tonal-pulse {
      0%, 100% { filter: brightness(1); transform: scale(1); }
      50%      { filter: brightness(1.15); transform: scale(1.02); }
    }

    /* MEDIA WIDGET */
    .media-widget { background: #121212; color: white; padding: 20px; min-height: 200px; justify-content: space-between; grid-column: span 2; }
    #squiggleCanvas { width: 100%; height: 40px; margin: 8px 0; }

    /* TIME & WEATHER */
    .time-widget { background: var(--m3-tertiary-container); color: #001D35; justify-content: space-between; }
    .clock-unit { font-variation-settings: 'wdth' 35, 'wght' 300, 'opsz' 144, 'GRAD' -20; font-size: 5.5rem; line-height: 0.8; letter-spacing: -4px; }
    .clock-unit.mins { opacity: 0.4; font-variation-settings: 'wdth' 30, 'wght' 300; }
    .ampm { align-self: flex-end; font-family: 'Google Sans'; font-weight: 700; font-size: 1.4rem; margin-top: -8px; }

    .weather-widget { background: var(--m3-secondary-container); color: #1D192B; justify-content: space-between; }
    .temp-display { font-variation-settings: 'wdth' 60, 'wght' 400, 'opsz' 48; font-size: 3.5rem; line-height: 1; letter-spacing: -1px; margin-top: 8px; }

    .status-bar { grid-column: span 2; background: var(--m3-container-high); flex-direction: row; justify-content: space-between; align-items: center; padding: 18px 24px; }
    .label-m3 { font-family: 'Google Sans'; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.6; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="bento-grid">
    <div class="widget profile-card">
      <div class="avatar-blob"></div>
      <h1 class="md-typescale-headline-medium" style="font-weight: 700; margin: 0; font-family: 'Google Sans';">Shreyaan Vashishtha</h1>
      <p class="md-typescale-body-medium" style="opacity: 0.7; margin-top: 4px;">HKUST • Science & Technology</p>
    </div>

    <div class="widget media-widget">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/c1/The_Weeknd_-_After_Hours.png" style="width: 44px; height: 44px; border-radius: 12px;">
        <div>
          <div class="md-typescale-title-small" style="font-weight: 700;">After Hours</div>
          <div class="md-typescale-label-medium" style="color: var(--m3-accent);">The Weeknd</div>
        </div>
      </div>
      <canvas id="squiggleCanvas"></canvas>
      <div style="display: flex; justify-content: space-around; align-items: center;">
        <md-icon-button style="--md-icon-button-icon-color: white;"><md-icon>skip_previous</md-icon></md-icon-button>
        <md-filled-icon-button id="playToggle" style="--md-filled-icon-button-container-color: white; --md-filled-icon-button-icon-color: black; --md-filled-icon-button-container-shape: 16px;">
          <md-icon id="playIcon">pause</md-icon>
        </md-filled-icon-button>
        <md-icon-button style="--md-icon-button-icon-color: white;"><md-icon>skip_next</md-icon></md-icon-button>
      </div>
    </div>

    <div class="widget time-widget">
      <div class="label-m3">Local Time</div>
      <div style="display: flex; flex-direction: column;">
        <div class="clock-unit" id="h">--</div>
        <div class="clock-unit mins" id="m">:--</div>
        <div class="ampm" id="ap">--</div>
      </div>
    </div>

    <div class="widget weather-widget">
      <div class="label-m3">Weather</div>
      <span class="material-symbols-outlined" style="font-size: 48px; color: #49454F;">partly_cloudy_day</span>
      <div>
        <div class="temp-display">20°</div>
        <div class="md-typescale-label-large" style="opacity: 0.8; font-weight: 600;">Partly Cloudy</div>
      </div>
    </div>

    <div class="widget status-bar">
       <div><div class="label-m3">Status</div><div class="md-typescale-body-large" style="font-weight: 500;">Developing M3 Systems</div></div>
       <md-assist-chip label="Active" style="--md-assist-chip-container-shape: 12px;"></md-assist-chip>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('squiggleCanvas');
    const ctx = canvas.getContext('2d');
    let phase = 0, isPlaying = true, currentAmp = 6, targetAmp = 6;

    function render() {
      const w = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
      const h = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      ctx.clearRect(0, 0, w, h);
      currentAmp += (targetAmp - currentAmp) * 0.1;
      
      ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(canvas.offsetWidth, 20);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 3; ctx.stroke();
      
      ctx.beginPath(); ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      const prog = canvas.offsetWidth * 0.72;
      for (let x = 0; x <= prog; x++) {
        const y = 20 + Math.sin(x * 0.12 + phase) * currentAmp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      
      ctx.beginPath(); ctx.arc(prog, 20 + Math.sin(prog * 0.12 + phase) * currentAmp, 5, 0, 7);
      ctx.fillStyle = '#FF3B30'; ctx.fill();
      
      if (isPlaying) phase -= 0.18;
      requestAnimationFrame(render);
    }

    document.getElementById('playToggle').onclick = () => {
      isPlaying = !isPlaying;
      targetAmp = isPlaying ? 6 : 0;
      document.getElementById('playIcon').innerText = isPlaying ? 'pause' : 'play_arrow';
    };

    function tick() {
      const d = new Date();
      let h = d.getHours();
      document.getElementById('h').innerText = String(h % 12 || 12).padStart(2, '0');
      document.getElementById('m').innerText = `:${String(d.getMinutes()).padStart(2, '0')}`;
      document.getElementById('ap').innerText = h >= 12 ? 'PM' : 'AM';
    }

    setInterval(tick, 1000); tick(); render();
  </script>
</body>
</html>
