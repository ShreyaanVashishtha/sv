<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shreyaan | Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wdth,wght,GRAD,opsz@25..151,100..1000,-200..150,8..144&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>

  <style>
    :root {
      --m3-surface: #FAF7FB;
      --m3-container: rgba(243, 237, 247, 0.85);
      --m3-accent: #6750A4;
      --m3-golden: #FFB300;
      --m3-text: #1C1B1F;
      --m3-text-v: #49454F;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dark-mode {
      --m3-surface: #0A0A0A;
      --m3-container: #1E1B20;
      --m3-accent: #D0BCFF;
      --m3-text: #E6E1E5;
      --m3-text-v: #CAC4D0;
    }

    body { 
      margin: 0; display: flex; justify-content: center; padding: 40px 16px; 
      font-family: 'Roboto Flex', sans-serif; background: var(--m3-surface);
      color: var(--m3-text);
    }

    .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 420px; width: 100%; }

    .header-box { grid-column: span 2; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
    .user-name { font-family: 'Google Sans'; font-weight: 700; font-size: 1.4rem; letter-spacing: -0.02em; }

    .widget { 
      background: var(--m3-container); border-radius: 28px; padding: 24px; 
      display: flex; flex-direction: column; position: relative; overflow: hidden;
      backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05);
    }

    .label-m3 { font-family: 'Google Sans'; font-weight: 700; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; color: var(--m3-text-v); }

    .action-row { grid-column: span 2; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .action-row::-webkit-scrollbar { display: none; }
    
    .chip {
      background: var(--m3-container); padding: 10px 16px; border-radius: 14px;
      font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
      text-decoration: none; color: var(--m3-text); border: 1px solid rgba(255,255,255,0.1);
    }

    .clock-h { font-variation-settings: 'wdth' 45, 'wght' 300; font-size: 5.5rem; line-height: 0.8; letter-spacing: -4px; }
    .clock-m { font-variation-settings: 'wdth' 35, 'wght' 300; font-size: 5.5rem; line-height: 0.8; letter-spacing: -4px; opacity: 0.35; }
    
    .solar-info { margin-top: 12px; font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
    .golden-tag { color: var(--m3-golden); display: flex; align-items: center; gap: 4px; }

    #squiggleCanvas { width: 100%; height: 40px; margin: 12px 0; }
    .bar { width: 10px; background: var(--m3-accent); border-radius: 10px; transition: height 0.6s ease; }
  </style>
</head>
<body>

  <div class="bento-grid">
    <div class="header-box">
      <span class="user-name">Shreyaan</span>
      <md-icon-button><md-icon>settings</md-icon></md-icon-button>
    </div>

    <div class="action-row">
      <a href="#" class="chip"><span class="material-symbols-outlined" style="font-size:16px;">camera</span>Photos</a>
      <a href="#" class="chip"><span class="material-symbols-outlined" style="font-size:16px;">code</span>GitHub</a>
      <a href="#" class="chip"><span class="material-symbols-outlined" style="font-size:16px;">description</span>CV</a>
    </div>

    <div class="widget" style="background: #000; color: white; grid-column: span 2;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/c1/The_Weeknd_-_After_Hours.png" style="width: 48px; height: 48px; border-radius: 10px;">
        <div>
          <div style="font-weight: 700;">After Hours</div>
          <div style="color: #FF3B30; font-size: 0.8rem; font-weight: 600;">The Weeknd</div>
        </div>
      </div>
      <canvas id="squiggleCanvas"></canvas>
      <div style="display: flex; justify-content: space-around;">
        <md-icon-button style="--md-icon-button-icon-color: white;"><md-icon>skip_previous</md-icon></md-icon-button>
        <md-filled-icon-button id="playToggle" style="--md-filled-icon-button-container-color: white; --md-filled-icon-button-icon-color: black;"><md-icon id="playIcon">pause</md-icon></md-filled-icon-button>
        <md-icon-button style="--md-icon-button-icon-color: white;"><md-icon>skip_next</md-icon></md-icon-button>
      </div>
    </div>

    <div class="widget">
      <div class="label-m3">Time</div>
      <div class="clock-h" id="h">--</div>
      <div class="clock-m" id="m">--</div>
      <div class="solar-info">
        <span id="sunset-timer" style="opacity: 0.7;">Syncing...</span>
        <span class="golden-tag">
          <span class="material-symbols-outlined" style="font-size: 14px;">wb_twilight</span>
          <span id="golden-hour">Golden: --:--</span>
        </span>
      </div>
    </div>

    <div class="widget" onclick="syncAll()" style="cursor: pointer;">
      <div class="label-m3" id="loc-label">Weather</div>
      <div id="temp" style="font-size: 3.2rem; font-weight: 500; margin: 4px 0; letter-spacing: -2px;">--°</div>
      <div id="w-desc" style="font-size: 0.65rem; opacity: 0.7; font-weight: 700;">Tap to Refresh</div>
    </div>

    <div class="widget" style="grid-column: span 2;">
      <div class="label-m3">6-Hour Forecast</div>
      <div id="forecastGraph" style="display: flex; justify-content: space-between; align-items: flex-end; height: 90px; margin-top: 10px;"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('squiggleCanvas');
    const ctx = canvas.getContext('2d');
    let phase = 0, isPlaying = true, currentAmp = 6, targetAmp = 6;
    let solarData = { sunset: null };

    async function syncAll() {
      // DEFAULT FALLBACK: Hong Kong General
      let lat = 22.3193, lon = 114.1694, city = "Hong Kong";
      
      try {
        const geoRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
        if (geoRes.ok) {
          const geo = await geoRes.json();
          lat = geo.latitude;
          lon = geo.longitude;
          city = geo.city || city;
        }
      } catch (e) { console.warn("Geo-blocked. Defaulting to Hong Kong."); }

      try {
        document.getElementById('loc-label').innerText = city;
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,is_day&hourly=temperature_2m,precipitation_probability&daily=sunset&timezone=auto`;
        const res = await fetch(weatherUrl).then(r => r.json());
        
        document.getElementById('temp').innerText = `${Math.round(res.current.temperature_2m)}°`;
        solarData.sunset = new Date(res.daily.sunset[0]);
        
        const gTime = new Date(solarData.sunset.getTime() - (60 * 60 * 1000));
        document.getElementById('golden-hour').innerText = `Golden: ${gTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        const graph = document.getElementById('forecastGraph');
        graph.innerHTML = '';
        const now = new Date().getHours();
        
        for(let i = 0; i < 6; i++) {
          const t = res.hourly.temperature_2m[i];
          const p = res.hourly.precipitation_probability[i];
          const barHeight = Math.max(15, Math.min(65, t * 1.8)); 
          
          graph.innerHTML += `
            <div style="text-align:center; flex:1; display:flex; flex-direction:column; align-items:center; justify-content: flex-end;">
              <div class="bar" style="height:${barHeight}px; background:${p > 25 ? '#42A5F5' : 'var(--m3-accent)'}; opacity:${1-(i*0.12)};"></div>
              <div style="font-size:0.55rem; margin-top:6px; font-weight:800;">${(now+i)%24}:00</div>
              <div style="font-size:0.5rem; color:#42A5F5; font-weight:700;">${p}%</div>
            </div>`;
        }
      } catch (e) { 
        document.getElementById('loc-label').innerText = "Sync Error";
      }
    }

    function updateSolar() {
      if (!solarData.sunset) return;
      const now = new Date();
      const diff = solarData.sunset - now;
      if (diff > 0) {
        const hrs = Math.floor(diff / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        document.getElementById('sunset-timer').innerText = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m till sunset`;
      } else {
        document.getElementById('sunset-timer').innerText = "After Hours";
      }
      document.body.classList.toggle('dark-mode', now >= solarData.sunset || now.getHours() < 6);
    }

    function render() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * dpr; canvas.height = canvas.offsetHeight * dpr;
      ctx.scale(dpr, dpr);
      currentAmp += (targetAmp - currentAmp) * 0.1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath(); ctx.strokeStyle = '#FF3B30'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let x = 0; x <= canvas.offsetWidth * 0.8; x++) {
        const y = 20 + Math.sin(x * 0.12 + phase) * currentAmp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      if (isPlaying) phase -= 0.15;
      requestAnimationFrame(render);
    }

    document.getElementById('playToggle').onclick = () => {
      isPlaying = !isPlaying; targetAmp = isPlaying ? 6 : 0;
      document.getElementById('playIcon').innerText = isPlaying ? 'pause' : 'play_arrow';
    };

    function tick() {
      const d = new Date();
      document.getElementById('h').innerText = String(d.getHours() % 12 || 12).padStart(2, '0');
      document.getElementById('m').innerText = String(d.getMinutes()).padStart(2, '0');
      updateSolar();
    }

    setInterval(tick, 1000); tick(); syncAll(); render();
  </script>
</body>
</html>
